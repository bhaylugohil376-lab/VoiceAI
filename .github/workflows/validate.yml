name: VoiceAI validation

on:
  pull_request:
  push:
    branches:
      - main
      - fix/full-project-audit
      - feat/provider-api-integration

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: npm run check
