
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceAI — Text to Speech</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .tts-container{max-width:1000px;margin:30px auto;padding:20px}
    .tts-card{padding:22px;border:1px solid #ddd;border-radius:16px;margin:18px 0}
    .tts-card label{display:block;font-weight:600;margin:14px 0 7px}
    .tts-card textarea,.tts-card select,.tts-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit}
    .tts-card textarea{min-height:170px;resize:vertical}
    .tts-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .tts-btn{padding:12px 18px;border:0;border-radius:9px;cursor:pointer;font-weight:600;margin-top:15px}
    .tts-primary{background:#6d4aff;color:white}
    .tts-status{margin:12px 0;overflow-wrap:anywhere}
    .tts-error{color:#c62828}
    .tts-success{color:#16803c}
    .tts-audio{width:100%;margin-top:14px}
    .tts-hidden{display:none}
    @media(max-width:600px){.tts-row{grid-template-columns:1fr}.tts-container{padding:12px}}
  </style>
</head>
<body>
  <main class="tts-container">
    <h1>Text to Speech</h1>
    <p>Convert your text into speech using your connected voice provider.</p>

    <section class="tts-card">
      <label for="ttsText">Enter your text</label>
      <textarea id="ttsText" maxlength="5000" placeholder="Type or paste your text here..."></textarea>
      <div><span id="charCount">0</span>/5000 characters</div>

      <div class="tts-row">
        <div>
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect">
            <option value="">Loading voices...</option>
          </select>
        </div>
        <div>
          <label for="outputFormat">Audio format</label>
          <select id="outputFormat">
            <option value="mp3_44100_128">MP3 — High quality</option>
            <option value="mp3_22050_32">MP3 — Smaller file</option>
          </select>
        </div>
      </div>

      <button id="generateBtn" class="tts-btn tts-primary" type="button">
        Generate speech
      </button>
      <button id="refreshVoicesBtn" class="tts-btn" type="button">
        Refresh voices
      </button>
      <div id="ttsStatus" class="tts-status" role="status" aria-live="polite"></div>
    </section>

    <section id="resultCard" class="tts-card tts-hidden">
      <h2>Your audio</h2>
      <audio id="audioPlayer" class="tts-audio" controls></audio>
      <br>
      <a id="downloadLink" class="tts-btn tts-primary" download="voiceai-speech.mp3">
        Download MP3
      </a>
    </section>
  </main>

  <script>
  (() => {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const textInput = $("ttsText");
    const voiceSelect = $("voiceSelect");
    const formatSelect = $("outputFormat");
    const generateBtn = $("generateBtn");
    const refreshBtn = $("refreshVoicesBtn");
    const status = $("ttsStatus");
    const resultCard = $("resultCard");
    const audioPlayer = $("audioPlayer");
    const downloadLink = $("downloadLink");

    let audioUrl = null;
    let requestInProgress = false;

    function showStatus(message, type = "") {
      status.textContent = message;
      status.className = "tts-status" + (type ? " " + type : "");
    }

    function getSupabaseClient() {
      // Uses the existing client if your project creates one.
      if (window.supabaseClient &&
          typeof window.supabaseClient.auth?.getSession === "function") {
        return window.supabaseClient;
      }

      // Otherwise configure these values in your project's existing config.
      const url = window.SUPABASE_URL;
      const key = window.SUPABASE_ANON_KEY;

      if (url && key && window.supabase?.createClient) {
        window.supabaseClient = window.supabase.createClient(url, key);
        return window.supabaseClient;
      }

      return null;
    }

    async function getAccessToken() {
      const client = getSupabaseClient();

      if (!client) {
        throw new Error(
          "Supabase client is not configured. Sign in and configure SUPABASE_URL and SUPABASE_ANON_KEY."
        );
      }

      const { data, error } = await client.auth.getSession();

      if (error) throw new Error(error.message);

      const token = data?.session?.access_token;
      if (!token) throw new Error("Please sign in before generating speech.");

      return token;
    }

    async function apiFetch(url, options = {}) {
      const token = await getAccessToken();

      const response = await fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          Authorization: "Bearer " + token
        }
      });

      if (!response.ok) {
        let message = "Request failed (" + response.status + ")";
        try {
          const payload = await response.json();
          message = payload.error || payload.message || message;
        } catch (_) {}
        throw new Error(message);
      }

      return response;
    }

    async function loadVoices() {
      voiceSelect.disabled = true;
      voiceSelect.replaceChildren(new Option("Loading voices...", ""));
      showStatus("Loading available voices...");

      try {
        const response = await apiFetch("/api/voices?page_size=100");
        const payload = await response.json();

        if (!payload.success || !Array.isArray(payload.voices)) {
          throw new Error(payload.error || "Voice API returned an invalid response.");
        }

        if (payload.voices.length === 0) {
          voiceSelect.replaceChildren(new Option("No voices available", ""));
          showStatus("No voices were returned by the provider.", "tts-error");
          return;
        }

        voiceSelect.replaceChildren();

        for (const voice of payload.voices) {
          if (!voice.voice_id || !voice.name) continue;

          const option = new Option(voice.name, voice.voice_id);
          const labels = voice.labels || {};
          const gender = labels.gender ? " • " + labels.gender : "";
          const category = voice.category ? " • " + voice.category : "";
          option.textContent = voice.name + gender + category;
          voiceSelect.add(option);
        }

        if (!voiceSelect.options.length) {
          throw new Error("The voice response contained no usable voice IDs.");
        }

        voiceSelect.disabled = false;
        showStatus("Loaded " + voiceSelect.options.length + " voices.", "tts-success");
      } catch (error) {
        voiceSelect.replaceChildren(new Option("Could not load voices", ""));
        showStatus(error.message, "tts-error");
      } finally {
        voiceSelect.disabled = false;
      }
    }

    async function generateSpeech() {
      if (requestInProgress) return;

      const text = textInput.value.trim();
      const voiceId = voiceSelect.value;
      const outputFormat = formatSelect.value;

      if (!text) {
        showStatus("Please enter some text first.", "tts-error");
        textInput.focus();
        return;
      }

      if (text.length > 5000) {
        showStatus("Text must be 5000 characters or fewer.", "tts-error");
        return;
      }

      if (!voiceId) {
        showStatus("Select a voice before generating speech.", "tts-error");
        return;
      }

      requestInProgress = true;
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      showStatus("Generating audio. Please wait...");
      resultCard.classList.add("tts-hidden");

      try {
        const response = await apiFetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            voice_id: voiceId,
            output_format: outputFormat
          })
        });

        // /api/tts returns binary audio, not JSON.
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const payload = await response.json();
          throw new Error(payload.error || "The API did not return audio.");
        }

        const audioBlob = await response.blob();

        if (!audioBlob.size) {
          throw new Error("The provider returned an empty audio file.");
        }

        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(audioBlob);

        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = "voiceai-speech.mp3";
        resultCard.classList.remove("tts-hidden");

        const remaining = response.headers.get("X-Usage-Remaining");
        showStatus(
          "Speech generated successfully." +
          (remaining !== null ? " Remaining usage: " + remaining : ""),
          "tts-success"
        );

        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        showStatus(error.message || "Could not generate speech.", "tts-error");
      } finally {
        requestInProgress = false;
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate speech";
      }
    }

    textInput.addEventListener("input", () => {
      $("charCount").textContent = textInput.value.length;
    });

    generateBtn.addEventListener("click", generateSpeech);
    refreshBtn.addEventListener("click", loadVoices);

    window.addEventListener("beforeunload", () => {
      if (audioUrl) URL.revokeObjectURL(audioUrl);
    });

    loadVoices();
  })();
  </script>
</body>
</html>
